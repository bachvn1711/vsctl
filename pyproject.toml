[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vssctl"
version = "0.1.0"
requires-python = ">=3.10"

dependencies = [
    "typer[all]",
    "rich",
    "pyyaml",
    "pydantic>=2",
    "jinja2",
    "textual>=0.40.0",
    "flask>=3.0.0",
]

[project.scripts]
vssctl = "vssctl.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

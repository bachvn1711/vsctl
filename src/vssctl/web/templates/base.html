<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}vssctl dashboard{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
  <header><a class="brand" href="{{ url_for('dashboard.index') }}"><img src="{{ url_for('dashboard.logo') }}" alt="vssctl logo"><span>vssctl <small>signal control plane</small></span></a><nav><a href="{{ url_for('dashboard.index') }}">Overview</a><a href="{{ url_for('explorer.index') }}">Workbench</a><a href="{{ url_for('teams.index') }}">Teams</a><a href="{{ url_for('reports.index') }}">Reports</a><a href="{{ url_for('reports.docs') }}">Docs</a></nav></header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
